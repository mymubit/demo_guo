# 短剧创作工作台机器契约
version: "1.0.0"
project_schema: project-settings.v1
parameters_contract: contracts/parameters.yaml

navigation:
  source: registry.yaml
  order_field: workspace_order
  group_field: dept

project_settings:
  groups:
    entry:
      label_zh: 创作入口
      fields: [entry_type, core_idea, synopsis, external_story, adapt_notes, reference_dramas]
    theme:
      label_zh: 题材与受众
      fields: [audience_channel, genre_matrix, protagonist_structure, flavor_tags, preset_theme_code, target_platform]
    scale:
      label_zh: 篇幅与批次
      fields: [episode_count, batch_episode_max, outline_mode]
    production:
      label_zh: 制作约束
      fields: [production_target_band, production_region, budget_currency, pricing_version, budget_excluded_items]
    quality:
      label_zh: 质量偏好
      fields: [scoring_preset, compliance_check_mode]
    delivery:
      label_zh: 交付偏好
      fields: [enable_delivery, delivery_items]

  fields:
    entry_type:
      parameter_ref: entry_type
      persist_path: entry_type
      config_scope: project
    core_idea:
      parameter_ref: core_idea
      persist_path: core_idea
      visible_when: "entry_type == 'original_track'"
      config_scope: project
    synopsis:
      parameter_ref: synopsis
      persist_path: synopsis
      visible_when: "entry_type == 'original_track'"
      config_scope: project
    external_story:
      parameter_ref: external_story
      persist_path: external_story
      required_when: "entry_type == 'story_adapt'"
      config_scope: project
    adapt_notes:
      parameter_ref: adapt_notes
      persist_path: adapt_notes
      visible_when: "entry_type == 'story_adapt'"
      config_scope: project
    reference_dramas:
      parameter_ref: reference_dramas
      persist_path: reference_dramas
      config_scope: project
    audience_channel:
      parameter_ref: audience_channel
      persist_path: audience_channel
      config_scope: project
    genre_matrix:
      parameter_ref: genre_matrix
      persist_path: genre_matrix
      config_scope: project
    protagonist_structure:
      parameter_ref: protagonist_structure
      persist_path: protagonist_structure
      config_scope: project
    flavor_tags:
      parameter_ref: flavor_tags
      persist_path: flavor_tags
      config_scope: project
    preset_theme_code:
      parameter_ref: preset_theme_code
      persist_path: preset_theme_code
      config_scope: project
    episode_count:
      parameter_ref: episode_count
      persist_path: episode_count
      config_scope: project
    target_platform:
      parameter_ref: target_platform
      persist_path: target_platform
      config_scope: project
    batch_episode_max:
      parameter_ref: batch_episode_max
      persist_path: creation_preferences.batch_episode_max
      config_scope: project
    outline_mode:
      parameter_ref: outline_mode
      persist_path: creation_preferences.outline_mode
      config_scope: project
    production_target_band:
      parameter_ref: production_target_band
      persist_path: production_context.target_band
      config_scope: project
    production_region:
      parameter_ref: production_region
      persist_path: production_context.region
      config_scope: project
    budget_currency:
      parameter_ref: budget_currency
      persist_path: production_context.currency
      config_scope: project
    pricing_version:
      parameter_ref: pricing_version
      persist_path: production_context.pricing_version
      config_scope: project
    budget_excluded_items:
      parameter_ref: budget_excluded_items
      persist_path: production_context.excluded_items
      config_scope: project
    scoring_preset:
      parameter_ref: scoring_preset
      persist_path: creation_preferences.scoring_preset
      config_scope: project
    compliance_check_mode:
      parameter_ref: check_mode
      persist_path: creation_preferences.compliance_check_mode
      config_scope: project
    enable_delivery:
      parameter_ref: enable_delivery
      persist_path: creation_preferences.enable_delivery
      config_scope: project
    delivery_items:
      parameter_ref: deliverables
      persist_path: creation_preferences.delivery_items
      visible_when: "enable_delivery == true"
      config_scope: project

derived_fields:
  - derived.matrix_key
  - derived.rule_params_ref
system_fields:
  - skills_version
  - skills_git_ref
  - platform_policy

runtime_projection:
  drama.topic-director:
    episode_count: episode_count
    target_platform: target_platform
    audience_channel: audience_channel
    genre_matrix: genre_matrix
    protagonist_structure: protagonist_structure
    flavor_tags: flavor_tags
    preset_theme_code: preset_theme_code
    core_idea: core_idea
    synopsis: synopsis
    reference_dramas: reference_dramas
  drama.story-bible:
    episode_count: episode_count
    outline_mode: creation_preferences.outline_mode
    external_story: external_story
    adapt_notes: adapt_notes
  drama.script-scorer:
    scoring_preset: creation_preferences.scoring_preset
  drama.compliance-guard:
    check_mode: creation_preferences.compliance_check_mode
    target_platform: target_platform
  drama.delivery-tool:
    deliverables: creation_preferences.delivery_items
    target_platform: target_platform
    production_context: production_context
    when: "creation_preferences.enable_delivery == true"
  drama.script-writer:
    production_target_band: production_context.target_band
  workflow:
    batch_episode_max: creation_preferences.batch_episode_max

# 命令作用域参数 — 不从项目设置投影，由每次执行命令的载荷提供。
# 校验规则：每个角色的 parameter_refs 必须被 runtime_projection ∪ command_scope_params 完整覆盖。
command_scope_params:
  drama.episode-designer: [episode_range]
  drama.script-writer: [episode_range]
  drama.script-scorer: [episode_range, scoring_mode]
  drama.revision-master: [episode_range, focus_areas]

stages:
  - {id: strategy, orchestration_phase: strategy, stage_kind: main, role: drama.topic-director, visible_when: "entry_type == 'original_track'"}
  - {id: blueprint, orchestration_phase: blueprint, stage_kind: main, role: drama.story-bible, approval_required: true}
  - {id: episode_design, orchestration_phase: episode_design, stage_kind: main, role: drama.episode-designer, batch_field: episode_range}
  - {id: writing, orchestration_phase: writing, stage_kind: main, role: drama.script-writer, batch_field: episode_range}
  - {id: quality_score, stage_kind: quality_loop, role: drama.script-scorer, parallel_group: quality}
  - {id: compliance, stage_kind: quality_loop, role: drama.compliance-guard, parallel_group: quality}
  - {id: revision, stage_kind: quality_loop, role: drama.revision-master, conditional: true}
  - {id: delivery, stage_kind: optional, role: drama.delivery-tool, optional: true, visible_when: "enable_delivery == true"}

module_panel:
  source: modules/catalog.yaml
  group_by: domain
  filter: "lifecycle == 'active' and workbench_visible == true"
  evaluate_enable_when: true
  allow_project_toggle: false

external_tools:
  script_review:
    input_artifact: external_script
    input_type: text_or_file
    accepted_formats: [txt, md, json]
    roles: [drama.script-scorer, drama.compliance-guard]
    runtime_params:
      scoring_mode: external

admin_settings:
  policy: manifest/config-policy.yaml
  sections:
    - {id: model_routing, source: foundation/constraints/agent-runtime.yaml}
    - {id: script_format, source: foundation/constraints/script-format.yaml}
    - {id: quality_thresholds, source: foundation/constraints/quality-scoring.yaml}
    - {id: commercial, source: foundation/constraints/commercial-formulas.yaml}
    - {id: scoring_presets, source: foundation/constraints/scoring-presets.yaml}
    - {id: platform_policies, source: foundation/constraints/platform-profiles.yaml}
    - {id: production_feasibility, source: foundation/constraints/production-feasibility.yaml}
  require_audit_reason: true
  allow_git_ssot_override: false
