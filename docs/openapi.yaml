      description: 套餐新增/更新输入
      properties:
        name:
          type: string
          minLength: 1
          title: 套餐名称
          maxLength: 100
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: 价格(元)
        original_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: 划线原价(元)
          description: 可选，用于展示划线价与折扣计算
        discount_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          title: 折扣(%)
          description: 100 表示无折扣；有划线原价时按 原价×折扣% 计算实付
        validity_days:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: 有效期(天)
        creation_quota:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: 创作次数配额
          description: 遗留字段；商业站以 grant_coins 为准
        grant_coins:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: 开通赠送币
          description: 开通/续费该套餐时发放的网站币
        features:
          title: 套餐特性
        is_active:
          type: boolean
          title: 是否启用
        is_recommended:
          type: boolean
          title: 是否推荐
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: 排序
          description: 数值越小越靠前
