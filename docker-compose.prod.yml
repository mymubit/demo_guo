# 生产 / 全容器部署（叠加在 docker-compose.yml 之上）
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scriptforge-backend
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_NAME=scriptforge
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:redis_password_2024@redis:6379/1
      - CACHE_URL=redis://:redis_password_2024@redis:6379/2
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set for production}
      - API_SIGN_SECRET=${API_SIGN_SECRET:?API_SIGN_SECRET must be set for production}
      - SKILL_ENCRYPT_KEY=${SKILL_ENCRYPT_KEY:?SKILL_ENCRYPT_KEY must be set for production}
      - MONITORING_ENABLED=${MONITORING_ENABLED:-true}
      - MONITORING_SAMPLE_RATE=${MONITORING_SAMPLE_RATE:-0.05}
      - MONITORING_SLOW_API_MS=${MONITORING_SLOW_API_MS:-1000}
      - MONITORING_SLOW_SQL_MS=${MONITORING_SLOW_SQL_MS:-500}
      - MONITORING_RETENTION_DAYS=${MONITORING_RETENTION_DAYS:-30}
      - MONITORING_MAX_BATCH_SIZE=${MONITORING_MAX_BATCH_SIZE:-50}
    volumes:
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py init_skill_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2"
    networks:
      - scriptforge-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scriptforge-worker
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_NAME=scriptforge
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:redis_password_2024@redis:6379/1
      - DJ_QUEUE_MODE=fork
      - DJ_QUEUE_WORKER_THREADS=2
      - MONITORING_ENABLED=${MONITORING_ENABLED:-true}
      - MONITORING_RETENTION_DAYS=${MONITORING_RETENTION_DAYS:-30}
    volumes: []
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    command: python manage.py dj_queue
    networks:
      - scriptforge-network

  nginx:
    image: nginx:alpine
    container_name: scriptforge-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - scriptforge-network

volumes:
  media_volume:
  nginx_logs:
