agent_id: drama.revision-master
name: Revision Master
name_zh: 剧本修复官
v6_persona: persona.revision-master
operations: [operation.revise-script]
dept: quality
role_tier: production
workspace_order: 503
modules:
- dialogue-polish
- format-fix
- word-count-governance
module_policy:
  source: modules/catalog.yaml
  evaluate_enable_when: true
  as_index: false
  max_chars: 0
knowledge_policy:
  # C5：修复参考长文仅 index
  mode: index
  max_chars: 1600
rule_policy:
  scopes:
  - global_core
  - genre_profile
  - stage_playbook
  max_chars: 0
  sections:
  - writing_prohibitions
  - writing_requirements
  - ai_tone_forbidden
  - emotion_externalization_dict
  - dialogue_quality
  - rhythm_rules
  - quantitative_constraints
  - format_standard
  - learned_rules
skill_dir: roles/drama-revision-master
# 独立技能：由评分环触发（低于 B 级）或用户手动调用；产出修复稿后必须交回评分官复评。
input_contract:
  required_artifacts:
  - latest_script
  optional_artifacts:
  - quality_report
  - compliance_report
  - story_bible
  - episode_plan
  parameter_refs:
  - episode_range
  - focus_areas
role: 根据评分报告、合规报告和用户要求修复剧本，执行对白精修、格式修复和字数治理；不重新设计故事，只提升文本执行质量；输出修复稿后必须提交剧本评分官复评。
