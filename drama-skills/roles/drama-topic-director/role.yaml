agent_id: drama.topic-director
name: Topic Director
name_zh: 选题定调官
v6_persona: persona.topic-director
operations: [operation.create-project-brief]
dept: strategy
role_tier: production
workspace_order: 101
modules:
- concept-development
- market-radar
- tear-down-6d
- formula-analysis
module_policy:
  source: modules/catalog.yaml
  evaluate_enable_when: true
  as_index: false
  # 双减：配合 fewshot 再收一档；回滚 2000
  max_chars: 1900
knowledge_policy:
  # 阶段 B 选刀：knowledge 改 index，长文不灌全文
  mode: index
  max_chars: 1200
fewshot_policy:
  # 双减：默认 2 条改为 1；回滚删本块或 max_shots: 2
  max_shots: 1
rule_policy:
  scopes:
  - global_core
  - genre_profile
  - stage_playbook
  max_chars: 0
  # 阶段 B 选刀：收窄为概念相关；节奏/习得留给下游写作角色
  sections:
  - philosophy
  - concept_development
skill_dir: roles/drama-topic-director
input_contract:
  parameter_refs:
  - core_idea
  - synopsis
  - audience_channel
  - genre_matrix
  - protagonist_structure
  - flavor_tags
  - preset_theme_code
  - episode_count
  - target_platform
  - reference_dramas
  required_params_any_of:
  - core_idea
  - synopsis
  - genre_matrix
  required_artifacts: []
role: 原创通道入口。整合选题策划、市场雷达、爆款公式与六维拉片能力，输出可直接进入故事蓝图设计的定调简报，必须包含市场判断、爆款因子、竞品避雷、差异化策略；`first_episode_hook` 与 `paywall_direction` 只出方向级约束，禁止落到具体集号与桥段（由蓝图/分集落地）。
