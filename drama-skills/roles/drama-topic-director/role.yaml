agent_id: drama.topic-director
name: Topic Director
name_zh: 选题定调官
dept: strategy
role_tier: production
workspace_order: 101
modules:
- concept-development
- market-radar
- tear-down-6d
- formula-analysis
module_policy:
  source: modules/catalog.yaml
  evaluate_enable_when: true
  as_index: false
  max_chars: 0
knowledge_policy:
  mode: full
  max_chars: 6000
rule_policy:
  scopes:
  - global_core
  - genre_profile
  - stage_playbook
  max_chars: 0
  # 与 knowledge/knowledge-sections.md 对齐；靠 sections 收窄
  sections:
  - philosophy
  - concept_development
  - rhythm_rules
  - episode_structure
  - learned_rules
skill_dir: roles/drama-topic-director
input_contract:
  parameter_refs:
  - core_idea
  - synopsis
  - audience_channel
  - genre_matrix
  - protagonist_structure
  - flavor_tags
  - preset_theme_code
  - episode_count
  - target_platform
  - reference_dramas
  required_params_any_of:
  - core_idea
  - synopsis
  - genre_matrix
  required_artifacts: []
role: 原创通道入口。整合选题策划、市场雷达、爆款公式与六维拉片能力，输出可直接进入故事蓝图设计的定调简报，必须包含市场判断、爆款因子、竞品避雷、差异化策略；`first_episode_hook` 与 `paywall_direction` 只出方向级约束，禁止落到具体集号与桥段（由蓝图/分集落地）。
