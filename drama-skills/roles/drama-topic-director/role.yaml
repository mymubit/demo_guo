agent_id: drama.topic-director
name: Topic Director
name_zh: 选题定调官
dept: strategy
role_tier: production
workspace_order: 101
default_output_artifact_key: project_brief
schema_version: project-brief.v1
modules:
- concept-development
- market-radar
- formula-analysis
- tear-down-6d
rule_policy:
  scopes:
  - global_core
  - genre_profile
  - stage_playbook
  max_chars: 3200
skill_dir: roles/drama-topic-director
input_contract:
  params_schema:
    core_idea: {type: string, required: false, ui_widget: textarea}
    synopsis: {type: string, required: false, ui_widget: textarea}
    genre_matrix:
      type: object
      required: false
      source_ref: foundation/theme-matrix.yaml#axes
    flavor_tags:
      type: array
      required: false
      max_items: 5
      source_ref: foundation/theme-matrix.yaml#flavor_tags.options
    preset_theme_code:
      type: string
      required: false
      source_ref: foundation/theme-matrix.yaml#preset_templates
    episode_count: {type: integer, required: true, minimum: 1}
    target_platform:
      type: string
      required: true
      source_ref: foundation/constraints/platform-profiles.yaml#platforms
      default: generic
    reference_dramas: {type: array, required: false, items_type: string}
  required_params_any_of:
  - core_idea
  - synopsis
  - genre_matrix
  required_artifacts: []
output_contract:
  artifacts:
  - project_brief
  schema_version: project-brief.v1
role: 原创通道入口。整合选题策划、市场雷达、爆款公式与六维拉片能力，输出可直接进入故事蓝图设计的定调简报，必须包含市场判断、爆款因子、竞品避雷、差异化策略、首集钩子和付费卡点方向。
