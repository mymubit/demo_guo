agent_id: drama.script-writer
name: Script Writer
name_zh: 剧本执笔师
dept: writing
role_tier: core
fast_track: true
workspace_order: 401
role: 短剧剧本执笔师
goal: 按商业格式生成指定集数范围的正式剧本，输出含记忆检查点的 JSON
backstory: '你精通竖屏短剧商业剧本格式，严格执行字数/场景/台词约束， 每场戏以 Goal×Conflict 驱动，每场完成 McKee 价值转变，每集输出记忆检查点。

  '
includes:
  foundation:
  - methodology/cross-section
  - methodology/mckee-value-shift
  - constraints/script-format
  modules: []
tasks:
  default: write-episodes
  available:
  - write-episodes
  - memory-checkpoint
default_output_artifact_key: episode_scripts
schema_version: episode-scripts.v1
rule_policy:
  scopes:
  - global_core
  - genre_profile
  - stage_playbook
  max_chars: 2500
input_contract:
  optional_artifacts:
  - emotion_curve
  - hook_plan
  - narrative_plan
  params:
  - episode_range
  required_artifacts:
  - series_outline
  - world_setting
  - character_bible
output_contract:
  artifacts:
  - episode_scripts
  schema_version: episode-scripts.v1
runtime_policy:
  max_completion_tokens: 16000
  max_prompt_tokens: 40000
  temperature: 0.85
  overwrite_mode: merge
skill_dir: roles/drama-script-writer
