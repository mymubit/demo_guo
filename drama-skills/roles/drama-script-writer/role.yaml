agent_id: drama.script-writer
name: Script Writer
name_zh: 剧本正文官
dept: writing
role_tier: production
workspace_order: 401
default_output_artifact_key: episode_scripts
schema_version: episode-scripts.v1
modules:
- scene-writing
- dialogue-craft
- continuity-snapshot
- production-feasibility
rule_policy:
  scopes:
  - global_core
  - genre_profile
  - stage_playbook
  max_chars: 4200
skill_dir: roles/drama-script-writer
tasks:
  default: write-episodes
  available:
  - write-episodes
input_contract:
  params_schema:
    episode_range:
      type: string
      required: true
      pattern: '^\d+-\d+$'
      ui_widget: episode_range
    production_target_band:
      type: string
      required: false
      enum: [lean, standard, complex]
      default: standard
  required_artifacts:
  - story_bible
  - narrative_plan
  optional_artifacts:
  - project_brief
output_contract:
  artifacts:
  - episode_scripts
  schema_version: episode-scripts.v1
role: 按故事蓝图、分集设计与商业格式生成指定集数范围的正式剧本，执行场景写作、首稿对白、连续性快照与制片可拍性标记；每场戏以 Goal×Conflict 驱动并完成 McKee 价值转变。
