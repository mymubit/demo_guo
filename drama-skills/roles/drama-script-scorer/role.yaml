agent_id: drama.script-scorer
name: Script Scorer
name_zh: 剧本评分官
dept: quality
role_tier: judge
workspace_order: 501
modules:
- continuity-audit
rule_policy:
  scopes:
  - global_core
  - genre_profile
  - stage_playbook
  max_chars: 3600
skill_dir: roles/drama-script-scorer
# 独立技能：latest_script 由 artifact resolver 解析当前有效剧本。
input_contract:
  required_artifacts:
  - latest_script
  optional_artifacts:
  - project_brief
  - story_bible
  - narrative_plan
  input_modes:
    project:
      required_artifacts: [latest_script, story_bible, narrative_plan]
    external:
      required_artifacts: [latest_script]
      optional_artifacts: [project_brief, story_bible, narrative_plan]
  parameter_refs:
  - scoring_mode
  - scoring_preset
  - episode_range
role: 独立十维剧本评分与连续性终审裁判，不能参与生成剧本；统一评估 latest_script，输出总分、等级、十维证据、连续性缺陷、返修优先级和是否可继续下一批；同一维度连续两次低于进化阈值时输出规则提案。
