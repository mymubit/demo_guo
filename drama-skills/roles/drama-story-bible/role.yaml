agent_id: drama.story-bible
name: Story Bible
name_zh: 剧本蓝图官
v6_persona: persona.story-architect
operations: [operation.compose-story-bible]
dept: blueprint
role_tier: production
workspace_order: 201
modules:
- character-system
- world-rules
- series-structure
- series-emotion-curve
- conflict-escalation
- reversal-foreshadowing
- payment-checkpoint
- adaptation-originality
module_policy:
  source: modules/catalog.yaml
  evaluate_enable_when: true
  as_index: false
  # 阶段 D：modules 为 Top 层（≈5.5k），设预算；回滚改为 0
  max_chars: 4200
knowledge_policy:
  # 阶段 B：长文改 index，保留 includes 优先级；回滚 mode: full / max_chars: 8000
  mode: index
  max_chars: 4000
  includes:
  - knowledge/quality/originality-rules.md
  - knowledge/quality/structured-output-guards.md
  - knowledge/craft/shanyin-screenwriting-exec.md
  - knowledge/craft/shanyin-series-exec.md
fewshot_policy:
  # 双减：默认 2 条改为 1；回滚删本块或 max_shots: 2
  max_shots: 1
rule_policy:
  scopes:
  - global_core
  - genre_profile
  - stage_playbook
  max_chars: 0
  sections:
  - philosophy
  - character_rules
  - world_rules
  - series_structure
  - emotion_externalization_dict
  - episode_structure
  - rhythm_rules
  - foreshadowing_rules
  - qdn_emotion_model
  - payment_checkpoint_3card
  - conflict_escalation
  - originality_rules
  - learned_rules
skill_dir: roles/drama-story-bible
# 双模式：原创模式吃 project_brief；改编模式吃 external_story，
# 两种模式输出同一 story_bible schema v1，下游角色无差别消费。
input_contract:
  optional_artifacts:
  - project_brief
  parameter_refs:
  - external_story
  - adapt_notes
  - episode_count
  - outline_mode
  input_modes:
    original:
      required_artifacts: [project_brief]
      forbidden_params: [external_story]
    adapt:
      required_params: [external_story]
      optional_artifacts: [project_brief]
  required_artifacts: []
role: 剧本蓝图官整合剧本梗概、人物系统、可行动世界规则与全剧架构，输出可直接进入分集设计的故事蓝图。原创模式基于立项简报展开；改编模式从用户提供的故事/小说/大纲中提取并补全同样结构，并完成原创性风险自检。只控制全局，不展开逐集细节。
