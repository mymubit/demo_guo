version: "1.0.0"
base_path: /api/v1/drama
response_envelope: {code: integer, message: string, data: object_or_null}

endpoints:
  - method: GET
    path: /projects/{project_id}/settings
    permission: project.read
    response_schema: schemas/project-settings.v1.schema.json
  - method: PUT
    path: /projects/{project_id}/settings
    permission: project.write
    request:
      schema: schemas/project-settings.v1.schema.json
      required_headers: [If-Match]
    behavior:
      - optimistic_lock
      - recompute_derived_fields
      - invalidate_downstream_when_blueprint_inputs_change
  - method: GET
    path: /projects/{project_id}/workflow
    permission: project.read
    response_schema: schemas/workflow-state.v1.schema.json
  - method: POST
    path: /projects/{project_id}/workflow/commands
    permission: project.execute
    request:
      required_fields: [command_id, event, expected_version]
    behavior: [idempotent_by_command_id, optimistic_lock]
  - method: POST
    path: /projects/{project_id}/approvals/story-bible
    permission: project.approve
    request:
      required_fields: [command_id, decision, expected_version]
      decision_enum: [approve, reject]
  - method: GET
    path: /projects/{project_id}/artifacts/{artifact_key}
    permission: project.read
    behavior: [resolve_schema_from_manifest, redact_sensitive_fields]
  - method: POST
    path: /external-script-reviews
    permission: project.execute
    request:
      content_types: [text/plain, text/markdown, application/json]
      required_fields: [command_id, scoring_preset, check_mode]
    behavior: [create_external_script, run_parallel_judges]
  - method: GET
    path: /admin/config
    permission: drama_config.read
    response_schema: schemas/ops-config-overlay.v1.schema.json
  - method: PUT
    path: /admin/config
    permission: drama_config.write
    request:
      schema: schemas/ops-config-overlay.v1.schema.json
      required_headers: [If-Match]
    behavior: [enforce_config_policy, append_immutable_audit_revision]
  - method: POST
    path: /admin/config/rollback
    permission: drama_config.rollback
    request:
      required_fields: [target_revision, change_reason]
    behavior: [append_new_revision, never_mutate_history]

errors:
  optimistic_lock_failed: {http_status: 409, code: 40901}
  idempotency_conflict: {http_status: 409, code: 40902}
  schema_validation_failed: {http_status: 422, code: 42201}
  workflow_gate_blocked: {http_status: 422, code: 42202}
  config_overlay_forbidden: {http_status: 403, code: 40301}
  platform_policy_unverified: {http_status: 422, code: 42203}
