# Drama Skills Bundle 清单
bundle_version: "6.0.0"
compatible_runtime_min: "5.0.0"

registries:
  roles: registry.yaml
  modules: modules/catalog.yaml
  sections: knowledge/knowledge-sections.md

configuration_sources:
  theme: foundation/theme-matrix.yaml
  platform: foundation/presets/platform-profiles.yaml
  script_format: foundation/constraints/script-format.yaml
  quality: foundation/constraints/quality-scoring.yaml
  scoring_presets: foundation/presets/scoring-presets.yaml
  commercial: foundation/constraints/commercial-formulas.yaml
  production_feasibility: foundation/presets/production-feasibility.yaml
  agent_runtime: foundation/presets/agent-runtime.yaml

artifact_contracts:
  contracts: contracts/artifacts.yaml
  index: knowledge/output-schemas.md
  continuity: foundation/constraints/continuity-checkpoint.yaml

validation:
  - python tools/validators/validate_all.py
  - python tools/generators/generate_parameter_schemas.py --check
  - python -m unittest discover -s tools/tests -p test_*.py -v
