name: Validate Drama Skills

on:
  pull_request:
  push:
    branches: [drama-skills]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validators/validate_skills.py
      - run: python tools/validators/validate_theme_matrix.py
      - run: python tools/generators/generate_parameter_schemas.py --check
      - run: python tools/validators/validate_workbench.py
      - run: python tools/validators/validate_artifacts.py
      - run: python tools/validators/validate_config.py
      - run: python tools/validators/validate_workflow.py
      - run: python tools/validators/validate_quality_cases.py
      - run: python -m unittest discover -s tools/tests -p "test_*.py" -v
