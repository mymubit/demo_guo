id: operation.write-episodes
version: 1
persona: persona.script-writer
user_inputs: [episode_range, writing_requests, style_preferences, preservation_requests]
system_inputs: [engine_version, artifact_schema_versions, active_rule_versions, caller_identity]
reads: [project_brief, story_bible, episode_plan, prior_memory_checkpoint, adjacent_episode_scripts, project_settings]
writes: [episode_scripts, memory_checkpoint]
scope:
  required: episode_range
  adjacent_context_before: 1
  adjacent_context_after: 1
required_params: [project_id, episode_range, base_version]
capabilities:
  - capability.load-episode-context
  - capability.prepare-episode-writing
  - capability.design-episode-structure
  - capability.plan-information-asymmetry
  - capability.write-scene
  - capability.write-dialogue
  - capability.externalize-emotion
  - capability.validate-screenplay-format
  - capability.lint-dialogue-style
  - capability.emit-memory-checkpoint
constraints:
  user_levels: [must_preserve, must_change, preference, avoid, question, system_lock]
  readonly: [story_bible, episode_plan.outside_requested_range, adjacent_episode_scripts]
  write_scope: requested_episodes_and_checkpoint_only
validation: [schema, scope, screenplay_format, continuity, story_bible_invariants, episode_plan_alignment, preservation, base_version]
outputs: [candidate, validation, structural_diff, semantic_diff, narrative_impact_diff, change_set, impact_plan]
stages: [command, plan, execution_pack, candidate, validation, change_set, impact_plan, commit]
transaction: {plan_required: true, candidate_only: true, validation_required: true, atomic_commit: true}
