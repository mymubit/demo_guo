# Drama Skills 全局索引 — Git SSOT
# v6.0：主链由 operation 驱动 4 个生产角色（选题→蓝图→分集→正文），评分/合规/修复为显式质检操作。
# 双入口：原创通道（original-track）与故事改编通道（story-adapt-track），在剧本蓝图处汇合。
version: 6.0.0
departments:
- code: strategy
  name_zh: 选题定调部
  order: 1
- code: blueprint
  name_zh: 剧本蓝图部
  order: 2
- code: episode_design
  name_zh: 分集设计部
  order: 3
- code: writing
  name_zh: 正文创作部
  order: 4
- code: quality
  name_zh: 质检修复部
  order: 5
- code: delivery
  name_zh: 宣发交付部
  order: 6
roles:
- agent_id: drama.topic-director
  skill_dir: roles/drama-topic-director
  name: Topic Director
  name_zh: 选题定调官
  dept: strategy
  role_tier: production
  workspace_order: 101
  modules:
  - concept-development
  - market-radar
  - tear-down-6d
  - formula-analysis
- agent_id: drama.story-bible
  skill_dir: roles/drama-story-bible
  name: Story Bible
  name_zh: 剧本蓝图官
  dept: blueprint
  role_tier: production
  workspace_order: 201
  modules:
  - character-system
  - world-rules
  - series-structure
  - series-emotion-curve
  - conflict-escalation
  - reversal-foreshadowing
  - payment-checkpoint
  - adaptation-originality
- agent_id: drama.episode-designer
  skill_dir: roles/drama-episode-designer
  name: Episode Designer
  name_zh: 分集设计官
  dept: episode_design
  role_tier: production
  workspace_order: 301
  modules:
  - episode-card
  - episode-emotion-nodes
  - hook-system
  - conflict-escalation
  - reversal-foreshadowing
  - payment-checkpoint
- agent_id: drama.script-writer
  skill_dir: roles/drama-script-writer
  name: Script Writer
  name_zh: 剧本正文官
  dept: writing
  role_tier: production
  workspace_order: 401
  default_task: write-episodes
  modules:
  - scene-writing
  - dialogue-craft
  - continuity-snapshot
  - production-feasibility
- agent_id: drama.script-scorer
  skill_dir: roles/drama-script-scorer
  name: Script Scorer
  name_zh: 剧本评分官
  dept: quality
  role_tier: judge
  workspace_order: 501
  modules:
  - continuity-audit
- agent_id: drama.compliance-guard
  skill_dir: roles/drama-compliance-guard
  name: Compliance Guard
  name_zh: 合规审查官
  dept: quality
  role_tier: judge
  workspace_order: 502
- agent_id: drama.revision-master
  skill_dir: roles/drama-revision-master
  name: Revision Master
  name_zh: 剧本修复官
  dept: quality
  role_tier: production
  workspace_order: 503
  modules:
  - dialogue-polish
  - format-fix
  - word-count-governance
- agent_id: drama.delivery-tool
  skill_dir: roles/drama-delivery-tool
  name: Delivery Tool
  name_zh: 宣发交付工具
  dept: delivery
  role_tier: tool
  workspace_order: 601
  modules:
  - storyboard-9col
  - visual-anchor
  - marketing-copy
  - delivery-check
  - story-to-game
  - budget-estimator
  - platform-ops-checklist
tools:
- id: drama-master
  skill_dir: drama-master
  description: 创作总入口：双通道路由（原创 / 故事改编）+ 阶段路由 + 质检环调度
- id: drama-intake
  skill_dir: drama-intake
  description: 技能进化入口：外部内容摄入 + 双轨道进化（A 规则升级 / B 素材沉淀）
contracts:
  artifacts: contracts/artifacts.yaml
  parameters: contracts/parameters.yaml
