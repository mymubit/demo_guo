# 组合约束 — 校验器与前端表单共同消费；违反时拒绝合成
tag_constraints:
  mutually_exclusive:
    - [sweet-heavy, melo-heavy]
  requires_world:
    wuxia: [ancient]
    palace: [ancient]
    harem: [ancient]
    zhainu: [ancient]
    xianxia: [ancient, fantasy]
    nongtian: [ancient, rural]
    shoushi: [fantasy]
    infinite-flow: [virtual, fantasy]
    game-world: [virtual]
    urban-fantasy: [modern]

param_synthesis:
  base:
    reversal_density: 0.28
    emotion_curve: [4, 4, 5, 5, 6, 7, 8, 8]
    act_ratio: [0.10, 0.20, 0.20, 0.20, 0.15, 0.15]
    hook_types: [Goal×Conflict, 集末悬念]

  emotion_profiles:
    revenge:
      reversal_density: 0.35
      emotion_curve: [3, 2, 1, 4, 7, 8, 9, 10]
      hook_types: [隐忍爆发, 身份反转, 真相揭露, 情感打脸]
    love:
      reversal_density: 0.25
      emotion_curve: [5, 4, 6, 5, 7, 8, 9, 10]
      hook_types: [误会解开, 吃醋反转, 告白时刻, 甜蜜暴击]
    healing:
      reversal_density: 0.15
      emotion_curve: [4, 3, 4, 5, 5, 6, 7, 8]
      hook_types: [痛点共鸣, 被理解时刻, 内心转变, 温暖出口]
    suspense:
      reversal_density: 0.60
      emotion_curve: [5, 6, 5, 7, 6, 8, 9, 10]
      hook_types: [真相揭露, 凶手反转, 时间错位, 双重人格]
    ambition:
      reversal_density: 0.45
      emotion_curve: [3, 2, 5, 4, 7, 6, 9, 10]
      hook_types: [权力反转, 站队翻盘, 布局收网, 身份揭秘]
    comedy:
      reversal_density: 0.20
      emotion_curve: [6, 5, 5, 6, 7, 7, 8, 8]
      hook_types: [误会喜剧, 反差打脸, 乌龙反转, 轻量爽点]
