# 题材矩阵 SSOT v2.0 — 频道 + 四轴 + 主角结构 + 风味标签
# v2.0 变更：
#   1. 受众频道升维为必选独立维度（市场第一级分类：男频/女频/普适）
#   2. identity 轴移除 dual-lead（主角数量不是身份禀赋），新增 returning-elite（强者归来）
#   3. 主角结构独立为可选维度（大男主/大女主/双强/双男主/双女主/多女主/群像）
#   4. 标签库对齐市场：删 5 个受众标签（升维/迁移），增 8 个高热标签，标签分 tier
#   5. 新增 tag_constraints 组合约束（互斥/世界观依赖）
#   6. 合成幂等：标签按 canonical 顺序叠加，与用户选择顺序无关
version: "2.0.0"

coverage_model:
  summary: |
    1. 受众频道（必选 1，默认 general）：男频 / 女频 / 普适
    2. 四轴（各 9 项）：主情绪 / 身份 / 冲突 / 时空
    3. 主角结构（可选 1）：大男主 / 大女主 / 双强 / 双男主 / 双女主 / 多女主 / 群像
    4. 风味标签（72 项 / 12 类，最多 5 个，分 hot/standard/longtail 三档）
    5. featured_combos 34 条：创新杂交种子，可归档至 inspirations/new-patterns.md
    6. topic_inference：自由创意 → 频道+四轴+结构+标签推断词表
  axis_combinations: 6561
  flavor_tag_count: 72
  featured_combo_count: 34
  validate: python build/validate_theme_matrix.py

dim_order:
  - emotion
  - identity
  - conflict
  - world

audience_channel:
  label_zh: 受众频道
  hint: 主要面向哪类观众，会影响爽点节奏与钩子写法
  required: true
  default: general
  options:
    - { value: female, label_zh: 女频, desc: 情感浓度优先；打脸虐渣/甜宠/大女主主赛道 }
    - { value: male, label_zh: 男频, desc: 强爽节奏优先；战神/神医/都市玄幻主赛道 }
    - { value: general, label_zh: 普适, desc: 不刻意区分频道的普适题材 }

protagonist_structure:
  label_zh: 主角结构
  hint: 单主角、双强或群像等；不选则随题材自动推断
  required: false
  options:
    - { value: single-male, label_zh: 大男主 }
    - { value: single-female, label_zh: 大女主 }
    - { value: dual-power, label_zh: 双强CP }
    - { value: bl, label_zh: 双男主 }
    - { value: gl, label_zh: 双女主 }
    - { value: multi-female, label_zh: 多女主 }
    - { value: ensemble, label_zh: 群像 }

axes:
  emotion:
    label_zh: 主情绪
    hint: 观众追看的核心爽点（为什么点开/追更），不是「感情戏」的意思
    min_select: 1
    max_select: 1
    options:
      - { value: revenge, label_zh: 复仇爽感, desc: 压抑后爆发、以牙还牙 }
      - { value: love, label_zh: 爱情甜虐, desc: 亲密拉扯与确认 }
      - { value: healing, label_zh: 治愈共鸣, desc: 痛点被看见、缓慢修复 }
      - { value: suspense, label_zh: 悬疑烧脑, desc: 信息差、反转、追真相 }
      - { value: ambition, label_zh: 野心逐权, desc: 权力/资源/阶层争夺 }
      - { value: comedy, label_zh: 喜剧解压, desc: 误会、反差、轻爽 }
      - { value: justice, label_zh: 正义昭雪, desc: 洗冤、恶人受罚、法理人情 }
      - { value: warmth, label_zh: 温情烟火, desc: 日常羁绊、小确幸、人情味 }
      - { value: nostalgia, label_zh: 怀旧情怀, desc: 时代记忆、逝去、重逢 }

  identity:
    label_zh: 主角身份
    hint: 主角相对世界的位置（谁在行动），与主情绪互补，不要重复选同义冲突
    min_select: 1
    max_select: 1
    options:
      - { value: underdog, label_zh: 弱势逆袭, desc: 被轻视后证明自己 }
      - { value: reborn, label_zh: 重生穿越, desc: 先知、改命、二次机会 }
      - { value: hidden-elite, label_zh: 隐藏大佬, desc: 真实与表面身份反差 }
      - { value: ordinary, label_zh: 普通人, desc: 无金手指，靠选择成长 }
      - { value: outcast, label_zh: 边缘异类, desc: 被体系排斥 }
      - { value: student, label_zh: 青春成长, desc: 学生/初入社会 }
      - { value: protector, label_zh: 守护照护, desc: 母职/长辈/照护者 }
      - { value: bound, label_zh: 契约绑定, desc: 赘婿/闪婚/替身/契约关系 }
      - { value: returning-elite, label_zh: 强者归来, desc: 战神/龙王/神医/高手下山，实力已成、重返世俗 }

  conflict:
    label_zh: 主冲突
    hint: 戏从哪里打起来（对抗场域）；与主情绪分工——情绪是「爽什么」，冲突是「打什么」
    min_select: 1
    max_select: 1
    options:
      - { value: family, label_zh: 家族伦理, desc: 婆媳、手足、继承 }
      - { value: workplace, label_zh: 职场商战, desc: 竞争、背叛、创业 }
      - { value: romance, label_zh: 情感关系, desc: 误会、禁忌、三角（主情绪选爱情时最常配对） }
      - { value: power, label_zh: 权谋斗争, desc: 派系、夺权、布局 }
      - { value: survival, label_zh: 生存危机, desc: 生死、限时、脱困 }
      - { value: crime, label_zh: 罪案追凶, desc: 案件、线索、洗冤 }
      - { value: disparity, label_zh: 阶级落差, desc: 贫富、城乡、圈层 }
      - { value: redemption, label_zh: 救赎弥补, desc: 悔过、补偿、和解 }
      - { value: tradition, label_zh: 礼教现代, desc: 传统与现代价值对撞 }

  world:
    label_zh: 时空背景
    hint: 故事发生的时空与规则；细分赛道（武侠/霸总等）用风味标签，不塞进这一轴
    min_select: 1
    max_select: 1
    options:
      - { value: modern, label_zh: 都市现代, desc: 当代城市生活 }
      - { value: ancient, label_zh: 古代古风, desc: 朝堂、江湖、门阀、古风社会 }
      - { value: republic, label_zh: 年代民国, desc: 乱世家族、时代洪流 }
      - { value: rural, label_zh: 乡土小镇, desc: 下沉、熟人社会 }
      - { value: fantasy, label_zh: 幻想异能, desc: 系统、异能、非现实规则 }
      - { value: campus, label_zh: 校园青春, desc: 中学/大学封闭社群 }
      - { value: scifi, label_zh: 科幻未来, desc: 近未来、科技伦理 }
      - { value: virtual, label_zh: 虚拟世界, desc: 游戏、元宇宙、副本 }
      - { value: overseas, label_zh: 异域出海, desc: 海外背景、文化碰撞 }

# 自定义四轴软引导：合成仍接受全量 6561；UI 用 prefer/discourage 降低离谱组合
axis_guidance:
  display_order: [emotion, conflict, identity, world]
  soft_rules:
    - when: { emotion: love }
      prefer: { conflict: [romance, family, disparity, tradition] }
      note: 爱情向主冲突优先落在关系/家庭/阶层
    - when: { emotion: revenge }
      prefer: { conflict: [family, workplace, disparity, power, tradition], identity: [underdog, reborn, bound, outcast] }
      note: 复仇向常见弱势/重生身份 + 家庭或阶层场域
    - when: { emotion: justice }
      prefer: { conflict: [crime, power, family, survival] }
      note: 正义向优先罪案/权谋/生存
    - when: { emotion: suspense }
      prefer: { conflict: [crime, survival, power], world: [modern, virtual, rural, scifi] }
      note: 悬疑向优先罪案或生存场域
    - when: { emotion: ambition }
      prefer: { conflict: [workplace, power, disparity, family], identity: [underdog, hidden-elite, reborn] }
    - when: { emotion: healing }
      prefer: { conflict: [redemption, family, romance, tradition], identity: [ordinary, protector, outcast] }
    - when: { emotion: warmth }
      prefer: { conflict: [family, redemption, tradition, romance], world: [modern, rural, overseas] }
    - when: { emotion: comedy }
      prefer: { conflict: [romance, workplace, family, tradition] }
    - when: { emotion: nostalgia }
      prefer: { conflict: [family, tradition, redemption, disparity], world: [republic, rural, modern, overseas] }
    - when: { identity: student }
      prefer: { world: [campus, modern] }
      discourage: { world: [ancient, republic, scifi] }
      note: 青春成长身份优先校园/都市
    - when: { identity: reborn }
      prefer: { world: [modern, ancient, republic, fantasy, virtual] }
      note: 重生穿越常配都市/古代/年代/幻想
    - when: { world: campus }
      prefer: { identity: [student, ordinary, underdog, returning-elite] }
      discourage: { identity: [hidden-elite, protector], conflict: [workplace, power] }
      note: 校园时空少见隐藏大佬/职场权谋
    - when: { world: ancient }
      prefer: { conflict: [power, family, romance, tradition], identity: [underdog, hidden-elite, outcast, reborn, bound] }
      discourage: { conflict: [workplace], identity: [student] }
      note: 古代少见现代职场与校园生身份
    - when: { world: rural }
      prefer: { conflict: [family, tradition, redemption, disparity, survival] }
      discourage: { conflict: [workplace] }
    - when: { world: virtual }
      prefer: { conflict: [survival, power, romance], identity: [ordinary, reborn, returning-elite, outcast] }
    - when: { conflict: romance }
      prefer: { emotion: [love, comedy, healing, warmth] }
    - when: { conflict: crime }
      prefer: { emotion: [suspense, justice, revenge] }
    - when: { conflict: workplace }
      prefer: { world: [modern, overseas, scifi], emotion: [ambition, revenge, comedy] }

