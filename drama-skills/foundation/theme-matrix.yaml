  merge_rules: |
    1. emotion_profiles[emotion] 为底（emotion 必选）
    2. 叠加 identity / conflict / world delta
    3. 对每个 flavor_tags[] 叠加 flavor_tag_deltas（最多 5 个）
    4. reversal_density clamp [0.12, 0.65]
    5. emotion_curve 向量相加，每节点 clamp [1, 10]
    6. act_ratio 归一化总和 = 1.0
    7. hook_types 去重保留 ≤ 10 个

