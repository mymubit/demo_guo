resolve:
  matrix_path:
    when: genre_matrix.emotion is set
    theme_code: matrix
    matrix_key: "{emotion}-{identity}-{conflict}-{world}|{sorted_flavor_tags_joined_by_plus}"
    params: synthesize_via param_synthesis
  preset_path:
    when: preset card clicked
    params: synthesize preset_templates.dims
  free_text_path:
    when: core_idea only
    params: topic-planner 推断 genre_matrix + flavor_tags（可 >3 标签时保留 top5 权重）

