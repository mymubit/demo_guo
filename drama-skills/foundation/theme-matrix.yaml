# 四轴题材矩阵 SSOT v1.4 — 全量覆盖 + 校验
version: "1.4.0"

coverage_model:
  summary: |
    1. 四轴（各 9 项）：主情绪 / 身份 / 冲突 / 时空
    2. 风味标签（69 项 / 12 类，最多 5 个）：全行业 + 形态创新长尾
    3. featured_combos 32 条：创新杂交种子，可归档至 inspirations/new-patterns.md
    4. topic_planner_inference：自由创意 → 四轴+标签推断词表
  axis_combinations: 6561
  flavor_tag_count: 69
  featured_combo_count: 32
  validate: python build/validate_theme_matrix.py

dim_order:
  - emotion
  - identity
  - conflict
  - world

axes:
  emotion:
    label_zh: 情感轴
    hint: 观众追看的主情绪（必选 1）
    min_select: 1
    max_select: 1
    options:
      - { value: revenge, label_zh: 复仇爽感, desc: 压抑后爆发、以牙还牙 }
      - { value: love, label_zh: 爱情甜虐, desc: 亲密拉扯与确认 }
      - { value: healing, label_zh: 治愈共鸣, desc: 痛点被看见、缓慢修复 }
      - { value: suspense, label_zh: 悬疑烧脑, desc: 信息差、反转、追真相 }
      - { value: ambition, label_zh: 野心逐权, desc: 权力/资源/阶层争夺 }
      - { value: comedy, label_zh: 喜剧解压, desc: 误会、反差、轻爽 }
      - { value: justice, label_zh: 正义昭雪, desc: 洗冤、恶人受罚、法理人情 }
      - { value: warmth, label_zh: 温情烟火, desc: 日常羁绊、小确幸、人情味 }
      - { value: nostalgia, label_zh: 怀旧情怀, desc: 时代记忆、逝去、重逢 }

  identity:
    label_zh: 身份轴
    hint: 主角处境与能力禀赋（选 1）
    min_select: 1
    max_select: 1
    options:
      - { value: underdog, label_zh: 弱势逆袭, desc: 被轻视后证明自己 }
      - { value: reborn, label_zh: 重生穿越, desc: 先知、改命、二次机会 }
      - { value: hidden-elite, label_zh: 隐藏大佬, desc: 真实与表面身份反差 }
      - { value: ordinary, label_zh: 普通人, desc: 无金手指，靠选择成长 }
      - { value: outcast, label_zh: 边缘异类, desc: 被体系排斥 }
      - { value: student, label_zh: 青春成长, desc: 学生/初入社会 }
      - { value: protector, label_zh: 守护照护, desc: 母职/长辈/照护者 }
      - { value: bound, label_zh: 契约绑定, desc: 赘婿/闪婚/替身/契约关系 }
      - { value: dual-lead, label_zh: 双强双核, desc: 双主角势均力敌、互为镜像 }

  conflict:
    label_zh: 冲突轴
    hint: 戏剧张力主来源（选 1）
    min_select: 1
    max_select: 1
    options:
      - { value: family, label_zh: 家族伦理, desc: 婆媳、手足、继承 }
      - { value: workplace, label_zh: 职场商战, desc: 竞争、背叛、创业 }
      - { value: romance, label_zh: 情感关系, desc: 误会、禁忌、三角 }
      - { value: power, label_zh: 权谋斗争, desc: 派系、夺权、布局 }
      - { value: survival, label_zh: 生存危机, desc: 生死、限时、脱困 }
      - { value: crime, label_zh: 罪案追凶, desc: 案件、线索、洗冤 }
      - { value: disparity, label_zh: 阶级落差, desc: 贫富、城乡、圈层 }
      - { value: redemption, label_zh: 救赎弥补, desc: 悔过、补偿、和解 }
      - { value: tradition, label_zh: 礼教现代, desc: 传统与现代价值对撞 }

  world:
    label_zh: 世界观轴
    hint: 时空与规则背景（选 1）
    min_select: 1
    max_select: 1
    options:
      - { value: modern, label_zh: 都市现代, desc: 当代城市生活 }
      - { value: ancient, label_zh: 古代宫廷, desc: 朝堂、后宫、门阀 }
      - { value: republic, label_zh: 年代民国, desc: 乱世家族、时代洪流 }
      - { value: rural, label_zh: 乡土小镇, desc: 下沉、熟人社会 }
      - { value: fantasy, label_zh: 幻想异能, desc: 系统、异能、非现实 }
      - { value: campus, label_zh: 校园青春, desc: 中学/大学封闭社群 }
      - { value: scifi, label_zh: 科幻未来, desc: 近未来、科技伦理 }
      - { value: virtual, label_zh: 虚拟世界, desc: 游戏、元宇宙、副本 }
      - { value: overseas, label_zh: 异域出海, desc: 海外背景、文化碰撞 }

