# 十维评分预设 SSOT
# 所有预设必须使用 quality-scoring.yaml 中定义的十个维度。
version: "1.1.0"
config_tier: seed_default

# 平台推荐预设（seed 默认；用户显式指定 scoring_preset 时以用户为准）
platform_recommendations:
  douyin: rhythm_first
  kuaishou: standard
  wechat_miniprogram: strict
  generic: standard

presets:
  standard:
    label_zh: 标准
    pass_threshold: 75
    delivery_eligible: true
    weights:
      format: 0.10
      narrative: 0.15
      conflict: 0.15
      character: 0.10
      emotion: 0.10
      logic: 0.10
      satisfaction: 0.10
      hooks: 0.10
      paywall: 0.05
      genre_fit: 0.05
  strict:
    label_zh: 严格
    pass_threshold: 80
    delivery_eligible: true
    weights:
      format: 0.10
      narrative: 0.16
      conflict: 0.15
      character: 0.12
      emotion: 0.11
      logic: 0.12
      satisfaction: 0.08
      hooks: 0.08
      paywall: 0.04
      genre_fit: 0.04
  relaxed:
    label_zh: 宽松
    pass_threshold: 60
    delivery_eligible: false
    weights:
      format: 0.10
      narrative: 0.14
      conflict: 0.14
      character: 0.10
      emotion: 0.11
      logic: 0.10
      satisfaction: 0.11
      hooks: 0.10
      paywall: 0.05
      genre_fit: 0.05
  rhythm_first:
    label_zh: 节奏优先
    pass_threshold: 75
    delivery_eligible: true
    weights:
      format: 0.08
      narrative: 0.17
      conflict: 0.13
      character: 0.07
      emotion: 0.10
      logic: 0.08
      satisfaction: 0.12
      hooks: 0.15
      paywall: 0.07
      genre_fit: 0.03
