# Agent LLM 运行参数 SSOT — seed_drama_skills 与运行时路由引用
version: "1.0.0"

agents:
  drama.topic-director:
    max_completion_tokens: 8000
    max_prompt_tokens: 30000
    temperature: 0.7
  drama.character-relations:
    max_completion_tokens: 10000
    max_prompt_tokens: 25000
    temperature: 0.8
  drama.series-architect:
    max_completion_tokens: 16000
    max_prompt_tokens: 30000
    temperature: 0.7
    overwrite_mode: merge
  drama.episode-designer:
    max_completion_tokens: 16000
    max_prompt_tokens: 40000
    temperature: 0.75
    overwrite_mode: merge
  drama.script-writer:
    max_completion_tokens: 16000
    max_prompt_tokens: 40000
    temperature: 0.85
    overwrite_mode: merge
  drama.revision-master:
    max_completion_tokens: 16000
    max_prompt_tokens: 40000
    temperature: 0.8
    overwrite_mode: merge
  drama.script-scorer:
    max_completion_tokens: 8000
    max_prompt_tokens: 40000
    temperature: 0.2
  drama.compliance-guard:
    max_completion_tokens: 8000
    max_prompt_tokens: 40000
    temperature: 0.1
  drama.delivery-tool:
    max_completion_tokens: 12000
    max_prompt_tokens: 40000
    temperature: 0.7
