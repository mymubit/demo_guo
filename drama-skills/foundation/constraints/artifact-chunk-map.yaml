# 流式分片产物配置 SSOT — chunk_service / stream_service 引用
version: "1.0.0"

artifacts:
  episode_scripts:
    kind: episode_scripts
    array_keys: [episodes]
  series_outline:
    kind: series_outline
    array_keys: [episodes, stages]
  polished_script:
    kind: polished_script
    array_keys: [episodes]
  narrative_plan:
    kind: narrative_plan
    array_keys: [episode_narrative_designs]
