# 流式分片产物配置 SSOT — chunk_service / stream_service 引用
# 配置分级：git_ssot（纯运行时工程配置，与代码同评审，不进后台）
# 仅保留当前产物键；历史别名不进入运行时。
version: "5.1.0"

artifacts:
  story_bible:
    kind: story_bible
    array_keys: [characters, series_structure.six_stage_structure]
  episode_scripts:
    kind: episode_scripts
    array_keys: [episodes]
  polished_script:
    kind: polished_script
    array_keys: [episodes]
  narrative_plan:
    kind: narrative_plan
    array_keys: [episode_narrative_designs]
  production_package:
    kind: production_package
    array_keys: [storyboard, visual_assets, marketing_assets]

virtual_artifacts:
  latest_script:
    resolver: first_existing
    candidates: [polished_script, episode_scripts, external_script]
    scope: episode_range

array_artifact_keys:
  - story_bible
  - episode_scripts
  - polished_script
  - narrative_plan
  - production_package

pipeline_result_keys:
  project_brief: project_brief
  story_bible: story_bible
  narrative_plan: narrative_plan
  episode_scripts: episode_scripts
  quality_report: quality_report
  compliance_report: compliance_report
  polished_script: polished_script
  production_package: production_package
