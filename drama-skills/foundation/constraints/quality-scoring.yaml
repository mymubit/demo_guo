# G-Eval 十维评分 — drama.script-scorer / DramaQualityService 引用
# 规则摘要见 foundation/rules/scoring-core.yaml · t1.global.scoring.ten-dimensions
# 配置分级：
#   dimensions（维度/权重/描述）= git_ssot：评分方法论，改动需评审进 Git
#   grade_thresholds / revision_threshold / fuse_rules = seed_default：
#     业务运营参数，商业网站应支持后台（system_config）覆盖，本文件提供默认值
version: "1.3.0"
config_tiers:
  dimensions: git_ssot
  business_defaults: seed_default
framework: geval
score_scale: 100

# 输出篇幅：target 写入 prompt 引导（够用即可）；min 为落库 substance 门禁（挡空壳）
output_length:
  dimension_analysis_target_chars: 400
  dimension_analysis_min_chars: 100
  verdict_detail_target_chars: 800
  verdict_detail_min_chars: 200
  continuity_summary_min_chars: 80

grade_thresholds:
  S: 90
  A: 80
  B: 75
  C: 60
  D: 0

revision_threshold: 40  # 单维 1-5 分制 ≤2/5 → 100 分制 ≤40 必须返工
# 质检分流（artifact_normalize.resolve_revision_route）：
#   structure_dims 失败占比更高 → rewrite_batch（正文重生）
#   否则 → text_polish（修复官）；合规 blocking → 工作台覆盖 user_gate
revision_route:
  structure_dims: [narrative, conflict, hooks, paywall, character, logic]
  text_signal_dims: [format, emotion, satisfaction, genre_fit]
evolution_threshold: 70

fuse_rules:
  fer_fail_rate: 0.10
  dream_safety_min: 7

format_error_rate:
  target_max: 0.05
  warning_above: 0.05
  fuse_at: 0.10

dimensions:
  - key: format
    name: 格式规范
    weight: 0.10
    desc: 场景标注/人物台词格式/字数控制/对话占比；FER目标≤5%，达到10%熔断
  - key: narrative
    name: 叙事效率
    weight: 0.15
    desc: 三幕式完整性/建置-对抗-结局/钩子-转折-高潮布局/节奏密度
  - key: conflict
    name: 冲突处理
    weight: 0.15
    desc: 核心冲突明确度/升级节奏/对抗强度/两难选择
  - key: character
    name: 角色一致性
    weight: 0.10
    desc: 主角弧光/人物区分度/行为合理性/Ghost-Lie-Flaw设计
  - key: emotion
    name: 情感深度
    weight: 0.10
    desc: 情绪起伏设计/单集关键情绪节点/共情度/情绪兑现
  - key: logic
    name: 逻辑一致性
    weight: 0.10
    desc: 世界观/动机/因果链/人物行为/常识合理性
  - key: satisfaction
    name: 爽点密度
    weight: 0.10
    desc: 每集至少一个有效兑现的爽点、甜点或强悬念；不以机械堆叠计数
  - key: hooks
    name: 钩子强度
    weight: 0.10
    desc: 开场钩子（分层窗口见 narrative-metrics.yaml#opening_hook）/集末cliffhanger/付费点钩子强度
  - key: paywall
    name: 付费点优化
    weight: 0.05
    desc: 付费卡点位置设计/断更点悬念/S级钩子配置
  - key: genre_fit
    name: 赛道匹配
    weight: 0.05
    desc: 符合目标题材规范/元素完整度/受众匹配度
