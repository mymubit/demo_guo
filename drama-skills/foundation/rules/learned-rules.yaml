# global_core · 跨项目经验规则（LR）— Git SSOT
# 详解长文：knowledge/craft/learned-rules.md；新增 LR 走 drama-intake 轨道一（规则进化）
version: "1.1.0"
tier: 1
items:
  - rule_key: t1.global.learned_rules.lr001
    section: learned_rules
    title: LR-001 复仇开场
    priority: 10
    body: "复仇/逆袭：第1集前30秒须展示主角被欺压，快速建立同情与愤怒。"
  - rule_key: t1.global.learned_rules.lr002
    section: learned_rules
    title: LR-002 甜宠独白
    priority: 11
    body: "甜宠/治愈：单角色连续内心独白不超过3句，优先互动与外化。"
  - rule_key: t1.global.learned_rules.lr003
    section: learned_rules
    title: LR-003 付费前钩子
    priority: 12
    body: "付费墙前最后一集集末钩子须为全剧 S 级强度。"
  - rule_key: t1.global.learned_rules.lr004
    section: learned_rules
    title: LR-004 反派逻辑
    priority: 13
    body: "反派失败须有合理逻辑，禁止降智式失败。"
  - rule_key: t1.global.learned_rules.lr005
    section: learned_rules
    title: LR-005 身份揭示
    priority: 14
    body: >-
      S级身份反转铺垫集数与揭露窗口读取
      foundation/constraints/narrative-metrics.yaml#s_reversal_foreshadow；揭示场景须有仪式感。
  - rule_key: t1.global.learned_rules.lr006
    section: learned_rules
    title: LR-006 推进节拍
    priority: 15
    body: "每集推进型节拍占比≥60%；推进型节拍须改变目标、阻碍、信息、关系、资源或不可逆后果之一。"
  - rule_key: t1.global.learned_rules.lr007
    section: learned_rules
    title: LR-007 付费兑现
    priority: 16
    body: "首付费卡点与兑现期限读取 foundation/constraints/commercial-formulas.yaml；付费后必须兑现卡点承诺。"
  - rule_key: t1.global.learned_rules.lr008
    section: learned_rules
    title: LR-008 逐集上下文
    priority: 17
    body: "生成第N集仅加载：N-1集全文+foundation/constraints/continuity-checkpoint.yaml 定义的检查点+本集分集卡+仍有效的全局约束。"
  - rule_key: t1.global.learned_rules.lr009
    section: learned_rules
    title: LR-009 喘息集限制
    priority: 18
    body: "松+轻喘息集每10集最多1次，禁止连续出现。"
  - rule_key: t1.global.learned_rules.lr010
    section: learned_rules
    title: LR-010 危机集节奏
    priority: 19
    body: "大反转/身份揭示/决裂集须为紧+重双轨组合。"
  - rule_key: t1.global.learned_rules.lr011
    section: learned_rules
    title: LR-011 结构化输出
    priority: 20
    body: >-
      角色产物必须是合法 JSON 对象：synopsis 等复合字段保持对象形态；
      禁止输出 artifact_key/schema_version/rule_params；枚举值不得同义改写。
      详见 knowledge/quality/structured-output-guards.md。
