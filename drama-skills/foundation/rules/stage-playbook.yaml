# stage_playbook · 阶段 playbook — Git SSOT（按 agent scope_key 过滤）
version: "2.1.0"
tier: 3
items:
  - rule_key: t3.drama-topic-director.project_brief.market-integrated
    section: philosophy
    scope_type: agent
    scope_key: drama.topic-director
    title: 选题定调必须吸收市场判断
    priority: 10
    body: |
      输出 project_brief 时必须包含故事梗概、市场机会判断、爆款因子、竞品避雷、差异化策略、首集钩子方向、首付费卡点方向和合规初筛。
      所有量化值读取 foundation/constraints/commercial-formulas.yaml。
  - rule_key: t3.drama-story-bible.dual-mode.same-schema
    section: philosophy
    scope_type: agent
    scope_key: drama.story-bible
    title: 双模式统一产出
    priority: 5
    body: |
      原创模式（输入 project_brief）与改编模式（输入 external_story）必须输出同一 story_bible schema v1 结构。
      改编模式先提取原故事人物/冲突/结构，再补全缺失部分，并显式列出「保留/强化/改写」处理说明与原创性风险自检。
  - rule_key: t3.drama-story-bible.character_rules.density
    section: character_rules
    scope_type: agent
    scope_key: drama.story-bible
    title: 角色密度与弧光
    priority: 10
    body: |
      执行 character_rules 与 series_structure；本阶段只负责把原子规则落实到 story_bible 字段。
      世界观必须执行 world_rules，并写入可行动规则、权力结构和信息释放边界。
  - rule_key: t3.drama-story-bible.episode_structure.six-stage
    section: episode_structure
    scope_type: agent
    scope_key: drama.story-bible
    title: 六阶段集数分配
    priority: 11
    body: |
      六阶段及缩放规则读取 series_structure 和 foundation/constraints/series-scale.yaml；
      题材 rule_params.act_ratio 可覆盖基础占比。
  - rule_key: t3.drama-episode-designer.episode_structure.episode-card
    section: episode_structure
    scope_type: agent
    scope_key: drama.episode-designer
    title: 分集设计卡
    priority: 10
    body: |
      执行 episode_card 原子规则并写入 narrative_plan schema v1；不得重写 story_bible 的主线与六阶段结构。
  - rule_key: t3.drama-script-writer.writing_requirements.episode-range
    section: writing_requirements
    scope_type: agent
    scope_key: drama.script-writer
    title: 分集写作约束
    priority: 10
    body: |
      格式与数值只读取 foundation/constraints/script-format.yaml；
      必须指定 episode_range；逐集依赖上一集全文+memory_checkpoint（LR-008）；禁止一次生成全剧。
      首稿必须执行 dialogue_craft，并输出 production_feasibility 制片标签。
  - rule_key: t3.drama-revision-master.writing_requirements.revision-only
    section: writing_requirements
    scope_type: agent
    scope_key: drama.revision-master
    title: 修复不重设故事
    priority: 10
    body: |
      剧本修复官只能根据评分报告、合规报告或用户指定问题改写文本执行质量；不得推翻已确认的选题、故事蓝图和分集设计。
      输出 polished_script 后必须交回剧本评分官复评，复评通过才可继续生成下一批。
  - rule_key: t3.drama-script-scorer.scoring.ten-dimension
    section: scoring
    scope_type: agent
    scope_key: drama.script-scorer
    title: 十维独立评分
    priority: 10
    body: |
      剧本评分官必须作为独立裁判执行十维 G-Eval 评分，覆盖格式、叙事、冲突、角色、情绪、逻辑、爽点、钩子、付费点、赛道匹配；不得参与剧本生成。
      评分对象统一读取 `latest_script`，并执行 continuity 连续性终审。
  - rule_key: t3.drama-script-scorer.scoring.evolution-proposal
    section: scoring
    scope_type: agent
    scope_key: drama.script-scorer
    title: 评分驱动技能进化
    priority: 20
    body: |
      单批 overall_score 低于 foundation/constraints/quality-scoring.yaml#evolution_threshold 须记录至 EVOLUTION_LOG.md；
      同一维度连续 2 次低于该阈值须向 @drama-intake
      轨道一（规则进化）输出 evolution_proposal（目标 foundation/rules/ 或对应 role.yaml）。
  - rule_key: t3.drama-compliance-guard.compliance.latest-script
    section: compliance_block
    scope_type: agent
    scope_key: drama.compliance-guard
    title: 合规裁判边界
    priority: 10
    body: |
      可执行规则只读取 foundation/rules/compliance-core.yaml 与 foundation/rules/originality-rules.yaml。
      只判断能否交付，不评价剧本好坏；审查对象统一读取 `latest_script`。
      P0 或未解决 P1 时拒绝出具通过报告，并阻断继续生成与交付流程。
  - rule_key: t3.drama-delivery-tool.delivery.gate
    section: format_standard
    scope_type: agent
    scope_key: drama.delivery-tool
    title: 交付前置门禁
    priority: 10
    body: |
      执行交付检查前必须读取 quality_report 与 compliance_report；
      无合规通过结论或评分低于 foundation/constraints/quality-scoring.yaml#grade_thresholds.B 时，
      只输出「不可交付+缺口清单」，不产出宣发物料。
      交付包必须包含制片复杂度/预算带与平台上架清单；政策未验证时不得标记可发布。
