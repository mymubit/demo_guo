# global_core · 结构与节奏簇（C3）
# 合并自 structure-rules.yaml + rhythm-rules.yaml；section id 保持不变
# stage-playbook（tier3）与 genres/matrix 题材合成不在本簇
version: "1.0.0"
tier: 1
cluster: structure

constraint_ssot:
  - foundation/constraints/series-scale.yaml
  - foundation/constraints/continuity-checkpoint.yaml
  - foundation/constraints/narrative-metrics.yaml#opening_hook
  - foundation/constraints/commercial-formulas.yaml#metrics.first_episode_hook_count

items:
  - rule_key: t1.global.series_structure.six-stage
    section: series_structure
    title: 六阶段结构
    priority: 10
    source_ref: knowledge/craft/shanyin-series-format.md
    body: |
      阶段顺序与基础占比读取 foundation/constraints/series-scale.yaml。
      题材合成后的 project_brief.rule_params.act_ratio 可覆盖基础占比；不得使用其他硬编码阶段比例。
  - rule_key: t1.global.series_structure.boundary
    section: series_structure
    title: 蓝图层结构边界
    priority: 11
    body: |
      全剧结构只定义主线、必要支线、阶段转折、付费节点、反转窗口和伏笔总表；不提前展开逐集场景。
      世界规则只保留会改变人物行动、代价或选择的内容。
  - rule_key: t1.global.episode_card.required-fields
    section: episode_card
    title: 分集卡必填字段
    priority: 10
    body: |
      每集必须明确核心事件、Goal×Conflict、集首与集末钩子、EV/ET/TP、爽点、反转、付费卡点、伏笔埋设/回扣及双轨节奏。
      分集卡只能展开已确认的全剧结构，不得重设主线。
  - rule_key: t1.global.continuity.checkpoint
    section: continuity
    title: 逐集连续性检查点
    priority: 10
    source_ref: knowledge/craft/shanyin-screenwriting-methodology.md
    body: |
      每集完成后按 foundation/constraints/continuity-checkpoint.yaml 输出 memory_checkpoint。
      生成第 N 集只加载 N-1 集全文、最新检查点、本集分集卡及仍有效的全局约束。
  - rule_key: t1.global.rhythm_rules.hook-density
    section: rhythm_rules
    title: 钩子密度
    priority: 10
    body: |
      首集开场分层窗口读取 foundation/constraints/narrative-metrics.yaml#opening_hook；
      首集钩子数量目标读取
      foundation/constraints/commercial-formulas.yaml#metrics.first_episode_hook_count。
      每集集末必须留未解问题；具体钩子等级规则见 hook_effectiveness（05-hooks-payoff）。
  - rule_key: t1.global.rhythm_rules.act-pacing
    section: rhythm_rules
    title: 六阶段节奏基线
    priority: 11
    body: |
      六阶段基础占比与集数换算只读取 foundation/constraints/series-scale.yaml；
      project_brief.rule_params.act_ratio 存在时覆盖基础占比。
      双轨节奏 [松/中/紧 × 轻/中/重] 禁止连续同格超过 2 集。
