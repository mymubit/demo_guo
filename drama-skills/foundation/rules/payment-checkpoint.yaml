# global_core · 付费卡点 — Git SSOT（payment_checkpoint_3card section）
version: "1.0.0"
tier: 1
items:
  - rule_key: t1.global.payment_checkpoint_3card.types
    section: payment_checkpoint_3card
    title: 三卡付费关卡类型
    priority: 10
    body: |
      情感卡：关系临界 / 告白前夕 / 分离危机。悬念卡：真相边缘 / 身份将揭 / 幕后浮现。
      爽感卡：打脸前夜 / 复仇倒计时 / 实力将曝。
  - rule_key: t1.global.payment_checkpoint_3card.timing
    section: payment_checkpoint_3card
    title: 卡点时机与兑现
    priority: 11
    body: |
      首付费卡点第 3–5 集（情感投入建立后）；习惯养成卡点第 8–12 集。付费后 1 集内须兑现承诺。
      S 级反转窗口 55–75%；首集钩子密度 ≥7（公式分析 SSOT）。
