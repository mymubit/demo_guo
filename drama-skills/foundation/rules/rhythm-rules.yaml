# global_core · 全局节奏基线 — Git SSOT（rhythm_rules section；题材 genre_profile 可覆盖配比）
version: "1.1.0"
tier: 1
items:
  - rule_key: t1.global.rhythm_rules.hook-density
    section: rhythm_rules
    title: 钩子密度
    priority: 10
    body: |
      首集开场分层窗口读取 foundation/constraints/narrative-metrics.yaml#opening_hook；
      首集钩子数量目标读取
      foundation/constraints/commercial-formulas.yaml#metrics.first_episode_hook_count。
      每集集末必须留未解问题；具体钩子等级规则见 hook_effectiveness。
  - rule_key: t1.global.rhythm_rules.act-pacing
    section: rhythm_rules
    title: 六阶段节奏基线
    priority: 11
    body: |
      六阶段基础占比与集数换算只读取 foundation/constraints/series-scale.yaml；
      project_brief.rule_params.act_ratio 存在时覆盖基础占比。
      双轨节奏 [松/中/紧 × 轻/中/重] 禁止连续同格超过 2 集。
