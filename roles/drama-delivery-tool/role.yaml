agent_id: drama.delivery-tool
name: Delivery Tool
name_zh: 宣发交付工具
dept: delivery
role_tier: tool
workspace_order: 601
default_output_artifact_key: production_package
schema_version: production-pack.v1
modules:
- storyboard-9col
- visual-anchor
- marketing-copy
- delivery-check
- story-to-game
- budget-estimator
- platform-ops-checklist
rule_policy:
  scopes:
  - global_core
  - genre_profile
  - stage_playbook
  max_chars: 3600
skill_dir: roles/drama-delivery-tool
input_contract:
  required_artifacts:
  - story_bible
  - latest_script
  - quality_report
  - compliance_report
  optional_artifacts:
  - project_brief
  params_schema:
    deliverables:
      type: array
      required: false
      enum_items: [storyboard, visual, marketing, interactive, budget, release]
      default: [storyboard, visual, marketing, budget]
    target_platform:
      type: string
      required: true
      source_ref: foundation/constraints/platform-profiles.yaml#platforms
      default: generic
    production_context:
      type: object
      required: false
output_contract:
  artifacts:
  - production_package
  schema_version: production-pack.v1
role: 可选制作发行工具；按需输出分镜、视觉、宣发、互动改编、制片复杂度/预算带与平台上架清单，交付检查必须读取质量报告与合规结果，剧本统一使用 latest_script。
