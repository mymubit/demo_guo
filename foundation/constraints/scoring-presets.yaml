    pass_threshold: 75
    weights:
      format: 0.10
      narrative: 0.15
      conflict: 0.15
      character: 0.10
      emotion: 0.10
      logic: 0.10
      satisfaction: 0.10
      hooks: 0.10
      paywall: 0.05
      genre_fit: 0.05
