services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scriptforge}
      POSTGRES_USER: ${POSTGRES_USER:-scriptforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scriptforge-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scriptforge} -d ${POSTGRES_DB:-scriptforge}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    env_file: .env
    environment:
      DJANGO_ENV: development
      DB_NAME: ${POSTGRES_DB:-scriptforge}
      DB_USER: ${POSTGRES_USER:-scriptforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-scriptforge-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DRAMA_SKILLS_ROOT: /app/drama-skills
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app/backend
      - ./drama-skills:/app/drama-skills:ro
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      celery: {condition: service_healthy}

  celery:
    build: ./backend
    env_file: .env
    environment:
      DJANGO_ENV: development
      DB_NAME: ${POSTGRES_DB:-scriptforge}
      DB_USER: ${POSTGRES_USER:-scriptforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-scriptforge-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DRAMA_SKILLS_ROOT: /app/drama-skills
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app/backend
      - ./drama-skills:/app/drama-skills:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 5s
      timeout: 6s
      retries: 20

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      # 开发态走 Vite 同源代理 /api → backend，避免浏览器直打 :8000 路径/CORS 混用
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:8000}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: npm run dev -- --host 0.0.0.0 --force
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
