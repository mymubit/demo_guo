version: '3.8'

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: scriptforge-db
    environment:
      POSTGRES_DB: scriptforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scriptforge-network

  # Redis 缓存与消息队列
  redis:
    image: redis:7-alpine
    container_name: scriptforge-redis
    command: redis-server --requirepass redis_password_2024
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scriptforge-network

  # Django 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scriptforge-backend
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_NAME=scriptforge
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:redis_password_2024@redis:6379/1
      - CACHE_URL=redis://:redis_password_2024@redis:6379/2
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
      - API_SIGN_SECRET=${API_SIGN_SECRET:-change-this-sign-secret}
      - SKILL_ENCRYPT_KEY=${SKILL_ENCRYPT_KEY:-32-byte-encrypt-key-change-me!!}
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py init_skill_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2"
    networks:
      - scriptforge-network

  # Celery Worker（异步任务）
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scriptforge-celery
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_NAME=scriptforge
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:redis_password_2024@redis:6379/1
      - CELERY_BROKER_URL=redis://:redis_password_2024@redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info
    networks:
      - scriptforge-network

  # Celery Beat（定时任务）
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scriptforge-celery-beat
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_NAME=scriptforge
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:redis_password_2024@redis:6379/1
      - CELERY_BROKER_URL=redis://:redis_password_2024@redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - scriptforge-network

  # Nginx 反向代理 + 静态文件
  nginx:
    image: nginx:alpine
    container_name: scriptforge-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - scriptforge-network

networks:
  scriptforge-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_volume:
  nginx_logs:
