# Windows / 本地开发默认：仅 Postgres + Redis
#   docker compose up -d
# 应用在本机跑：npm run dev（前端 + runserver + dj_queue worker）

services:
  db:
    image: postgres:15-alpine
    container_name: scriptforge-db
    environment:
      POSTGRES_DB: scriptforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scriptforge-network

  redis:
    image: redis:7-alpine
    container_name: scriptforge-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis_change_me}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scriptforge-network

networks:
  scriptforge-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
